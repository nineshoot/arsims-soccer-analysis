name: scheduled-predictions

on:
  schedule:
    # Times are UTC; GitHub often starts scheduled runs hours late. Twice a
    # day because football-data.co.uk publishes a weekend's fixtures only a
    # day or so ahead - a once-a-week run never sees them, and every
    # Friday-to-Sunday match went unpredicted from October onwards.
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:          # let you run it by hand from the Actions tab

permissions:
  contents: write             # needed to commit predictions + PNGs back

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Settle first: a fixture that has just been played gets its result
      # before the prediction step sees it, and a settled row is final.
      - name: Settle results
        run: python -m scripts.settle_results

      - name: Predict upcoming fixtures + redraw calibration
        run: python -m scripts.run_pipeline

      - name: Commit outputs
        run: |
          git config user.name  "prediction-bot"
          git config user.email "bot@users.noreply.github.com"
          git add predictions_log.csv output/
          git commit -m "auto: predictions $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git pull --rebase --autostash origin main
          git push
